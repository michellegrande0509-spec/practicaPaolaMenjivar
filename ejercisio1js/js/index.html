<body>
   
 
 
    <script>
        let name = (prompt("Escribe tu nombre:"));
        let numero1, numero2;
 
        numero1 = Number(prompt("Escribe tu primer numero:"));
        numero2 = Number(prompt("Escribe tu segundo numero:"));
resultadosuma=numero1+numero2
document.write("<h1>Hola " + name + "</h1>");
document.write("<h1>El resultado de tu suma es : " + resultadosuma + "</h1>");
 
resultadorestas=numero1-numero2
document.write("<h1>El resultado de tu resta es : " + resultadorestas + "</h1>");
 
resultadomultiplicacion=numero1*numero2
document.write("<h1>El resultado de tu multiplicacion es : " + resultadomultiplicacion + "</h1>");
 
resultadodivision=numero1/numero2
document.write("<h1>El resultado de tu division es : " + resultadodivision + "</h1>");
residuodivision=numero1%numero2
document.write("<h1>El residuo de tu division es : " + residuodivision + "</h1>");
 
    </script>
