<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva de Viaje</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2 {
            color: #2c3e50;
        }
        form {
            max-width: 500px;
            margin: auto;
        }
        section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        button {
            background-color: #2c3e50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>
    <h1>Formulario de Reserva de Viaje</h1>
    <form>
        <!-- Sección Datos Personales -->
        <section>
            <h2>Datos Personales</h2>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="example@email.com" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>
        </section>

        <!-- Sección Datos del Viaje -->
        <section>
            <h2>Datos del Viaje</h2>
            <label for="acompanantes">Número de acompañantes:</label>
            <input type="number" id="acompanantes" name="acompanantes" min="1" max="5" step="1" required>

            <label for="origen">Lugar de origen:</label>
            <input type="text" id="origen" name="origen" value="San Salvador" readonly>

            <label for="destino">Lugar de destino:</label>
            <select id="destino" name="destino" required>
                <option value="">Seleccione un destino</option>
                <option value="Lauterbrunnen">Lauterbrunnen</option>
                <option value="Florencia">Florencia</option>
                <option value="Barcelona">Barcelona</option>
                <option value="Venecia">Venecia</option>
            </select>

            <label for="salida">Fecha de salida:</label>
            <input type="date" id="salida" name="salida" required>

            <label for="regreso">Fecha de regreso:</label>
            <input type="date" id="regreso" name="regreso" required>
        </section>

        <button type="submit">Reservar</button>
    </form>
</body>
</html>
